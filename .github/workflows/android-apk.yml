name: Android APK

# Builds the installable Android app (APK) from the web app and signs it with Joe's own key.
# Run it by hand: GitHub repo > Actions > Android APK > Run workflow. Nothing else triggers it, so the secrets stay safe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools (root for sharp, android-app for Capacitor)
        run: |
          npm ci
          npm ci --prefix android-app

      - name: Copy the web app into the APK folder
        run: node android-app/scripts/prepare.mjs

      - name: Create the Android project
        working-directory: android-app
        run: npx cap add android

      - name: Demi icon, splash, keep-screen-on, version number
        working-directory: android-app
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Pack the web app into the project
        working-directory: android-app
        run: npx cap sync android

      - name: Build (unsigned release)
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign with Joe's key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/demi.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/demi.p12" --ks-pass env:KS_PASS --ks-key-alias demi --key-pass env:KS_PASS --out demi-plank.apk aligned.apk
          "$BT/apksigner" verify --print-certs demi-plank.apk
          rm -f "$RUNNER_TEMP/demi.p12"
          ls -l demi-plank.apk

      - uses: actions/upload-artifact@v4
        with:
          name: demi-plank-apk
          path: demi-plank.apk
          retention-days: 30
